services:
  # Local open-source model (optional: the app falls back to rules without it)
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Uncomment for NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build: ./backend
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: mistral:7b-instruct
      CORS_ORIGINS: "*"
      DB_PATH: /app/data/tool.db
      # Enable auth (one key per organisation; data is isolated per organisation):
      # API_KEYS: "change-me-a:acme:alice,change-me-b:globex"
      # Use the local model for tender score proposals instead of the offline rules baseline:
      # PROPOSER: ollama
    volumes:
      - backend_data:/app/data
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  ollama:
  backend_data:
